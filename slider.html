<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 70%;
      }

      body {
        background: white;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 90%;
        height: 90%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 300px;
        height: 300px;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }
      h1 {
        text-align: center;
        color: black;
        margin-top: 40px;
        margin-bottom: 40px;
      }
      .swiper-pagination {
        position: relative;
        bottom: 0;
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Gallery Property</h1>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="assets/property-1.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-2.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-3.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-4.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-5.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-6.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-7.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-8.jpg" alt="" />
        </div>
        <div class="swiper-slide">
          <img src="assets/property-9.jpg" alt="" />
        </div>
      </div>
      <!-- <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div> -->
    </div>
    <div class="swiper-pagination"></div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
